[workspace]
members = [
    "crates/mona-login",
    "crates/mona-shell",
    "crates/mona-terminal",
    "crates/mona-calculator",
    "crates/mona-notes",
    "crates/mona-settings",
    "crates/mona-finder",
]
resolver = "2"

[workspace.dependencies]
slint = { version = "1.18.1", default-features = false, features = ["backend-winit", "renderer-femtovg", "compat-1-0"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"

[profile.release]
opt-level = 2
lto = false
codegen-units = 16
debug = false
strip = true
panic = "abort"
incremental = false
