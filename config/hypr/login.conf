# ==============================================================================
# MONA OS — GREETD LOGIN COMPOSITOR ENVIRONMENT
# Dedicated locked-down Hyprland instance hosting mona-login
# ==============================================================================

monitor=,preferred,auto,1

# Launch mona-login as the primary window
exec-once = mona-login

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

windowrule = float, ^(mona-login)$
windowrule = fullscreen, ^(mona-login)$
windowrule = noborder, ^(mona-login)$
windowrule = noshadow, ^(mona-login)$
