# ==============================================================================
# MONA OS — BAREBONES WINDOW MANAGER DOTFILES (HYPRLAND BASE)
# Re-architected for 1:1 macOS Sequoia Ergonomics, Physics & Visual Hierarchy
# ==============================================================================

# --- 1. DISPLAY & MONITORS ---
# Auto-detect resolution, refresh rate, and scale
monitor=,preferred,auto,1

# --- 2. ENVIRONMENT VARIABLES ---
env = XDG_CURRENT_DESKTOP,Mona:Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Mona
env = GDK_BACKEND,wayland,x11
env = QT_QPA_PLATFORM,wayland;xcb
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland

# --- 3. AUTOSTART CORE DAEMONS ---
# Launch the 24pt translucent Menu Bar and Frosted Glass Dock
exec-once = mona-shell
# Launch Wallpaper manager
exec-once = hyprpaper
# Launch PipeWire audio engine
exec-once = /usr/bin/pipewire & /usr/bin/wireplumber
# Launch Polkit agent
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# --- 4. INPUT & TRACKPAD (macOS Natural Scrolling & Gestures) ---
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0.0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true          # macOS inverted natural scrolling
        scroll_factor = 0.85           # Smooth deceleration
        tap-to-click = true            # Single tap click
        clickfinger_behavior = true    # Two-finger tap for secondary click (Right-Click)
        middle_button_emulation = false
        drag_lock = false
    }
}

gestures {
    workspace_swipe = true             # 3-finger horizontal swipe between Spaces
    workspace_swipe_fingers = 3
    workspace_swipe_distance = 300
    workspace_swipe_invert = true
    workspace_swipe_min_speed_to_force = 30
    workspace_swipe_cancel_ratio = 0.4
}

# --- 5. WINDOW MANAGEMENT RULES (FLOATING BY DEFAULT LIKE macOS) ---
# In macOS, every application window is a floating canvas in Quartz/WindowServer.
# We enforce floating by default across all windows:
windowrule = float, ^(.*)$

# Minimum and default sizes
windowrule = size 960 620, ^(mona-finder)$
windowrule = size 640 540, ^(mona-settings)$
windowrule = size 580 380, ^(mona-notes)$
windowrule = size 260 360, ^(mona-calculator)$
windowrule = size 720 460, ^(mona-terminal)$

# Centers dialogs and new windows
windowrule = center, ^(mona-.*)$

# Suppress maximize event from apps to preserve Mac floating windows
windowrulev2 = suppressevent maximize, class:.*

# Exclude Mona Shell (Menu Bar and Dock) from standard window management
windowrulev2 = noborder, class:^(mona-shell)$
windowrulev2 = noshadow, class:^(mona-shell)$

# --- 6. VISUALS & GLASSMORPHY (KAWASE DUAL-FILTER BLUR & SHADOWS) ---
general {
    gaps_in = 8
    gaps_out = 16
    border_size = 1
    # Subtle macOS window border: 20% white keyline with 10% dark outline
    col.active_border = rgba(ffffff44) rgba(ffffff15) 45deg
    col.inactive_border = rgba(00000033)

    layout = dwindle
    no_focus_fallback = false
    apply_sens_to_raw = false
    resize_on_border = true
    extend_border_grab_area = 15
    hover_icon_on_border = true
}

decoration {
    rounding = 12                       # 12px squircle window corner radius
    active_opacity = 0.98               # Translucent vibrancy
    inactive_opacity = 0.94

    # Dual-Drop Ambient & Directional Shadow
    shadow {
        enabled = true
        range = 35
        render_power = 4
        color = rgba(00000055)
        offset = 0, 10
    }

    # Dual-Filter Kawase Blur underneath windows
    blur {
        enabled = true
        size = 10                       # Filter kernel radius
        passes = 3                      # 3-pass dual Kawase downsample/upsample
        new_optimizations = true
        xray = false                    # Do not blur through to desktop behind stacked windows
        noise = 0.015                   # Subtle analog dithering to eliminate 8-bit banding
        contrast = 0.92
        brightness = 1.05
        vibrancy = 0.35                 # WCAG AAA color saturation preservation
    }
}

# --- 7. APPLE COREANIMATION SPRING CURVES ---
# Evaluates underdamped spring ODE: m*x'' + c*x' + k*x = 0
animations {
    enabled = true

    # Custom Bezier Curves matching Apple CoreAnimation CAMediaTimingFunction
    bezier = macSpring, 0.22, 1, 0.36, 1
    bezier = macEaseOut, 0.16, 1, 0.3, 1
    bezier = macBounce, 0.34, 1.45, 0.7, 1

    # Window Launch (Pop-in scale 85% -> 100% with spring overshoot)
    animation = windows, 1, 4, macSpring, popin 85%
    # Window Close (Smooth zoom out)
    animation = windowsOut, 1, 3, macEaseOut, popin 85%
    # Window Move / Resize
    animation = windowsMove, 1, 3, macSpring
    # Window Fade (crossfade)
    animation = fade, 1, 3, macEaseOut
    # Spaces / Workspaces switching (Smooth horizontal slide)
    animation = workspaces, 1, 4, macSpring, slide
}

# --- 8. KEYBOARD SHORTCUTS & ERGONOMICS (macOS Command Key Mapping) ---
# SUPER is mapped as the Apple Command (⌘) key

# System & Shell
bind = SUPER, SPACE, exec, mona-shell --spotlight         # ⌘ + Space -> Spotlight Search
bind = SUPER, TAB, exec, mona-shell --switcher            # ⌘ + Tab -> App Switcher HUD
bind = SUPER CTRL, SPACE, exec, mona-shell --emoji        # ⌘ + Ctrl + Space -> Character Viewer
bind = SUPER, C, exec, wl-copy                            # ⌘ + C -> Copy
bind = SUPER, V, exec, wl-paste                           # ⌘ + V -> Paste
bind = SUPER, X, exec, wl-copy --clear                    # ⌘ + X -> Cut
bind = SUPER, A, exec, ydotool key 29:1 30:1 30:0 29:0    # ⌘ + A -> Select All

# Window Controls
bind = SUPER, Q, killactive,                              # ⌘ + Q -> Quit Application
bind = SUPER, W, killactive,                              # ⌘ + W -> Close Window
bind = SUPER, M, exec, mona-shell --minimize-active       # ⌘ + M -> Minimize to Dock
bind = SUPER, H, exec, mona-shell --hide-active           # ⌘ + H -> Hide Application
bind = SUPER CTRL, F, fullscreen, 1                       # ⌘ + Ctrl + F -> Fullscreen Zoom

# Default App Launchers
bind = SUPER, RETURN, exec, mona-terminal                 # Terminal
bind = SUPER, N, exec, mona-notes                         # Notes
bind = SUPER, S, exec, mona-settings                      # Settings
bind = SUPER, E, exec, mona-finder                        # Finder
bind = SUPER, K, exec, mona-calculator                    # Calculator

# Screenshots (macOS shortcuts)
# ⌘ + Shift + 4 -> Interactive region snip to clipboard
bind = SUPER SHIFT, 4, exec, grim -g "$(slurp)" - | wl-copy && notify-send "Screenshot copied to clipboard"
# ⌘ + Shift + 3 -> Fullscreen capture to clipboard
bind = SUPER SHIFT, 3, exec, grim - | wl-copy && notify-send "Fullscreen screenshot copied"

# Workspaces (Spaces 1-5)
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5

# Move window to Space
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5

# Window Dragging & Resizing with Mouse (Left Click = Drag, Right Click = Resize)
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow
